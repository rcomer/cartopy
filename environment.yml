# To set up a development environment using conda, run:
#
#   conda env create -f environment.yml
#   conda activate cartopy-dev
#   pip install -e .
#
name: cartopy-dev
channels:
  - conda-forge
dependencies:
  - cython>=3.0
  - numpy>=1.26
  - matplotlib-base>=3.8
  - shapely>=2.0
  - pyshp>=2.3.1
  - pyproj>=3.6.0
  # PROJ 9.8 changes the way equicylindrical projections (PlateCarree)
  # are transformed, which causes some issues. Temporary pin PROJ < 9.8
  # to avoid these for now.
  - proj<9.8

  # OWS
  - owslib>=0.29
  - pillow>=9.1
  # Plotting
  - scipy>=1.11
  # Testing
  - pytest
  - pytest-mpl
  - pytest-xdist
  - packaging>=21
  # Documentation
  - pydata-sphinx-theme
  - sphinx
  - sphinx-copybutton
  - sphinx-gallery
  # Extras
  - fiona
  - pre-commit
  - pykdtree
  - ruff
  - setuptools_scm
